name: EMA Alert Bot

on:
  schedule:
    - cron: "25 14 * * 1-5"   # 9:25 AM ET (winter time)
    - cron: "55 19 * * 1-5"   # 2:55 PM ET, queues behind the first run
  workflow_dispatch:           # lets you start it manually

concurrency:
  group: ema-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: timeout 345m python ema_support_bot.py || true
